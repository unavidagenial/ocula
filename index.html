<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>La Caperucita Roja - Tablero de Comunicación Aumentativa (CAA)</title>

  <!-- MediaPipe Face Mesh & Camera Utils -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 10px 20px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    h1 {
      margin: 0;
      font-size: 1.1rem;
      font-weight: 600;
      color: #38bdf8;
    }
    .status-badge {
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.85rem;
      background: #334155;
      color: #94a3b8;
    }
    .status-badge.active {
      background: #065f46;
      color: #6ee7b7;
    }

    /* Grilla de 12 tarjetas: 4 columnas x 3 filas */
    .grid-board {
      flex: 1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(3, 1fr);
      gap: 12px;
      padding: 12px;
    }

    .card {
      background: #ffffff;
      color: #0f172a;
      border-radius: 14px;
      border: 4px solid #cbd5e1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.15s ease, border-color 0.2s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      padding: 6px;
    }

    .card.hovered {
      border-color: #0284c7;
      transform: scale(1.02);
    }

    .card img, .card svg {
      max-height: 55%;
      max-width: 65%;
      object-fit: contain;
      margin-bottom: 6px;
    }

    .card-label {
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      text-align: center;
      color: #1e293b;
    }

    .dwell-progress {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 8px;
      width: 0%;
      background: #0284c7;
      transition: width 0.05s linear;
    }

    #gaze-cursor {
      position: fixed;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.85);
      border: 2px solid #ffffff;
      pointer-events: none;
      transform: translate(-50%, -50%);
      z-index: 9999;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.8);
      display: none;
    }

    #camera-preview {
      position: fixed;
      bottom: 12px;
      right: 12px;
      width: 130px;
      height: 95px;
      border-radius: 8px;
      border: 2px solid #38bdf8;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1000;
      background: #000;
    }
  </style>
</head>
<body>

  <header>
    <h1>La Caperucita Roja — Tablero CAA</h1>
    <div id="status" class="status-badge">Iniciando cámara...</div>
  </header>

  <main class="grid-board" id="aac-grid">
    <!-- Fila 1: Personajes -->
    <div class="card" data-phrase="Caperucita roja">
      <img src="https://i.pinimg.com/originals/15/3b/ef/153bef0e68858821313046d939879898.png" alt="Caperucita">
      <div class="card-label">Caperucita roja</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Lobo feroz">
      <img src="https://thumbs.dreamstime.com/b/lobo-del-caperucita-rojo-133290514.jpg?w=576" alt="Lobo">
      <div class="card-label">Lobo feroz</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Abuelita">
      <img src="https://i.pinimg.com/736x/ec/d4/15/ecd41592c82c876acde4a13f1cdd9529.jpg" alt="Abuelita">
      <div class="card-label">Abuelita</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Cazador">
      <img src="https://th.bing.com/th/id/R.a242839f13b8c4c933dacdc6c93a27d0?rik=mQqfArX3UB4zqQ&riu=http%3a%2f%2frosatubes.r.o.pic.centerblog.net%2f9ffb9949.png&ehk=IuVpWW%2fle2W41u3LcigfQYlHmPLRkaSPseEcpk4hKBY%3d&risl=&pid=ImgRaw&r=0" alt="Cazador">
      <div class="card-label">Cazador</div>
      <div class="dwell-progress"></div>
    </div>

    <!-- Fila 2: Necesidades y familia -->
    <div class="card" data-phrase="Tengo sed, por favor dame agua">
      <svg viewBox="0 0 100 100" stroke="#0284c7" stroke-width="4" fill="none" stroke-linejoin="round">
        <path d="M28 20 L72 20 L62 85 A 4 4 0 0 1 58 89 L42 89 A 4 4 0 0 1 38 85 Z" fill="#e0f2fe"></path>
        <path d="M33 45 Q 50 40 67 45" stroke="#38bdf8" stroke-width="3" fill="none"></path>
      </svg>
      <div class="card-label">Tengo sed</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Necesito descansar">
      <svg viewBox="0 0 100 100" fill="none" stroke="#475569" stroke-width="3" stroke-linecap="round">
        <rect x="15" y="55" width="70" height="25" rx="4" fill="#cbd5e1"></rect>
        <circle cx="35" cy="45" r="10" fill="#fed7aa" stroke="#ea580c"></circle>
        <path d="M25 55 L75 55 L75 75 L25 75 Z" fill="#93c5fd"></path>
        <path d="M45 42 Q 60 30 75 42" stroke="#64748b" stroke-dasharray="2 3"></path>
      </svg>
      <div class="card-label">Descansar</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Quiero a mi familia">
      <svg viewBox="0 0 100 100" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round">
        <circle cx="32" cy="30" r="8" fill="#fed7aa"></circle>
        <path d="M22 65 L22 45 C 22 40 42 40 42 45 L42 65" fill="#86efac"></path>
        <circle cx="68" cy="32" r="8" fill="#fed7aa"></circle>
        <path d="M58 65 L58 47 C 58 42 78 42 78 47 L78 65" fill="#f472b6"></path>
        <circle cx="50" cy="54" r="6" fill="#fed7aa"></circle>
        <path d="M44 80 L44 66 C 44 62 56 62 56 66 L56 80" fill="#fde047"></path>
      </svg>
      <div class="card-label">Mi familia</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Tengo hambre, quiero comer">
      <svg viewBox="0 0 100 100" fill="none" stroke="#ea580c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="48" cy="30" r="10" fill="#fed7aa"></circle>
        <path d="M48 42 L48 78" stroke-width="4"></path>
        <path d="M48 50 L68 50 L68 44" stroke-width="3"></path>
        <circle cx="70" cy="42" r="3" fill="#ea580c"></circle>
        <path d="M40 90 L48 78 L56 90" stroke-width="4"></path>
      </svg>
      <div class="card-label">Tengo hambre</div>
      <div class="dwell-progress"></div>
    </div>

    <!-- Fila 3: Emociones y Respuestas -->
    <div class="card" data-phrase="Estoy enojado">
      <img src="https://i.pinimg.com/1200x/f0/6d/94/f06d947e51f04483e0a6aa2f4f8832d6.jpg" alt="Enojado">
      <div class="card-label">Enojado</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Estoy feliz">
      <img src="https://i.pinimg.com/736x/3d/d6/ee/3dd6ee19c54365815e73cec6aa777249.jpg" alt="Feliz">
      <div class="card-label">Feliz</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Estoy triste">
      <img src="https://i.pinimg.com/736x/93/c4/56/93c456d0300ecda60e7d26f2aa37fd71.jpg" alt="Triste">
      <div class="card-label">Triste</div>
      <div class="dwell-progress"></div>
    </div>

    <div class="card" data-phrase="Sí">
      <img src="https://thumbs.dreamstime.com/b/icono-de-marca-verificaci%C3%B3n-blanca-en-bot%C3%B3n-verde-con-marco-blanco-475662500.jpg?w=768" alt="Sí">
      <div class="card-label">Sí</div>
      <div class="dwell-progress"></div>
    </div>
  </main>

  <div id="gaze-cursor"></div>
  <video id="camera-preview" autoplay playsinline muted></video>

  <script>
    const statusEl = document.getElementById('status');
    const gazeCursor = document.getElementById('gaze-cursor');
    const videoElement = document.getElementById('camera-preview');
    const cards = document.querySelectorAll('.card');

    let currentTarget = null;
    let dwellTimer = null;
    let dwellStart = null;
    const DWELL_DURATION = 1400;

    function hablar(texto) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES';
      utterance.rate = 0.95;
      utterance.pitch = 1.0;
      window.speechSynthesis.speak(utterance);
    }

    cards.forEach(card => {
      card.addEventListener('click', () => {
        hablar(card.dataset.phrase);
        card.style.transform = 'scale(0.96)';
        setTimeout(() => card.style.transform = '', 150);
      });
    });

    function handleGazePosition(x, y) {
      gazeCursor.style.left = `${x}px`;
      gazeCursor.style.top = `${y}px`;
      gazeCursor.style.display = 'block';

      const element = document.elementFromPoint(x, y);
      const hoveredCard = element ? element.closest('.card') : null;

      if (hoveredCard !== currentTarget) {
        resetDwell();
        if (hoveredCard) {
          currentTarget = hoveredCard;
          currentTarget.classList.add('hovered');
          dwellStart = performance.now();
          startDwellCycle();
        }
      }
    }

    function resetDwell() {
      if (currentTarget) {
        currentTarget.classList.remove('hovered');
        const bar = currentTarget.querySelector('.dwell-progress');
        if (bar) bar.style.width = '0%';
      }
      currentTarget = null;
      dwellStart = null;
      if (dwellTimer) cancelAnimationFrame(dwellTimer);
    }

    function startDwellCycle() {
      function tick(now) {
        if (!currentTarget || !dwellStart) return;
        const elapsed = now - dwellStart;
        const progress = Math.min((elapsed / DWELL_DURATION) * 100, 100);
        const bar = currentTarget.querySelector('.dwell-progress');
        if (bar) bar.style.width = `${progress}%`;

        if (progress >= 100) {
          hablar(currentTarget.dataset.phrase);
          resetDwell();
        } else {
          dwellTimer = requestAnimationFrame(tick);
        }
      }
      dwellTimer = requestAnimationFrame(tick);
    }

    // Inicialización de MediaPipe FaceMesh
    const faceMesh = new FaceMesh({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`
    });

    faceMesh.setOptions({
      maxNumFaces: 1,
      refineLandmarks: true,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    faceMesh.onResults((results) => {
      if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
        statusEl.textContent = 'Rastreo activo';
        statusEl.classList.add('active');

        const landmarks = results.multiFaceLandmarks[0];
        const leftIris = landmarks[468];
        const rightIris = landmarks[473];

        const avgX = 1 - (leftIris.x + rightIris.x) / 2;
        const avgY = (leftIris.y + rightIris.y) / 2;

        const screenX = Math.max(0, Math.min(window.innerWidth, (avgX - 0.3) * 2.5 * window.innerWidth));
        const screenY = Math.max(0, Math.min(window.innerHeight, (avgY - 0.2) * 2.2 * window.innerHeight));

        handleGazePosition(screenX, screenY);
      } else {
        statusEl.textContent = 'Buscando rostro...';
        statusEl.classList.remove('active');
        resetDwell();
      }
    });

    // Inicialización directa con fallback nativo a getUserMedia
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { width: 640, height: 480, facingMode: 'user' },
          audio: false
        });
        videoElement.srcObject = stream;
        await videoElement.play();

        const camera = new Camera(videoElement, {
          onFrame: async () => {
            await faceMesh.send({ image: videoElement });
          },
          width: 640,
          height: 480
        });
        camera.start();
        statusEl.textContent = 'Cámara conectada';
      } catch (err) {
        console.error('Error de acceso a la cámara:', err);
        statusEl.textContent = 'Error: permiso de cámara bloqueado o no disponible';
      }
    }

    window.addEventListener('DOMContentLoaded', startCamera);
  </script>
</body>
</html>
